  <title>Page not found — EraClash Basketball</title>
  <style>
    :root { color-scheme: light; }

    header { background: #0b0e17; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }

    main { display: grid; place-items: center; padding: 32px 16px; }
    .card { width: 100%; max-width: 560px; background: #FFFDF8; border: 1px solid #E5DCC8; border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 6px 18px rgba(20, 16, 10, 0.06); }
    .k { font-size: 11px; font-weight: 900; letter-spacing: 2.4px; color: #8B660B; margin: 0 0 8px; }
    h1 { margin: 0 0 10px; font-size: 26px; line-height: 1.15; }
    p { margin: 0 0 20px; color: #5A6577; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 140px; padding: 0 18px; border-radius: 10px; font-weight: 900; letter-spacing: 1.2px; text-decoration: none; font-size: 13px; }
    .btn-gold { background: linear-gradient(180deg, #F5C553, #E8B13C); color: #14100a; border: 1px solid #B9841F; }
    .btn-quiet { background: transparent; color: #1B2434; border: 1px solid #C9BFA9; }
    footer { padding: 16px; text-align: center; font-size: 12px; color: #636c83; border-top: 1px solid #E5DCC8; }
  </style>
</head>
