<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="none" role="presentation">
  <!-- Three depths of head-and-shoulder silhouettes. Geometry only: no faces,
       no traced people, and it tiles horizontally without a visible seam. -->
  <defs>
    <g id="row">
      <path d="M0 120 V70 a10 10 0 0 1 20 0 V120 Z"/>
      <circle cx="10" cy="60" r="8"/>
      <path d="M28 120 V74 a9 9 0 0 1 18 0 V120 Z"/>
      <circle cx="37" cy="65" r="7"/>
      <path d="M54 120 V68 a11 11 0 0 1 22 0 V120 Z"/>
      <circle cx="65" cy="57" r="8.5"/>
      <path d="M84 120 V76 a8 8 0 0 1 16 0 V120 Z"/>
      <circle cx="92" cy="68" r="6.5"/>
    </g>
  </defs>
  <rect width="400" height="120" fill="#01050a"/>
  <g fill="#000000" fill-opacity="0.85">
    <use href="#row" x="0" y="6"/><use href="#row" x="100" y="6"/>
    <use href="#row" x="200" y="6"/><use href="#row" x="300" y="6"/>
  </g>
  <g fill="#0a1220" fill-opacity="0.9">
    <use href="#row" x="-46" y="18"/><use href="#row" x="54" y="18"/>
    <use href="#row" x="154" y="18"/><use href="#row" x="254" y="18"/><use href="#row" x="354" y="18"/>
  </g>
  <g fill="#121c2e" fill-opacity="0.75">
    <use href="#row" x="24" y="34"/><use href="#row" x="124" y="34"/>
    <use href="#row" x="224" y="34"/><use href="#row" x="324" y="34"/>
  </g>
</svg>
