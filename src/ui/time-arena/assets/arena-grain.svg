<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="presentation">
  <!-- Film grain from a turbulence filter: a few hundred bytes rather than a
       tiled noise bitmap. -->
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="160" height="160" filter="url(#g)" opacity="0.55"/>
</svg>
